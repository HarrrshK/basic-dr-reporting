services:
  - type: web
    name: dr-reporting-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: BACKUP_INTERVAL_SECONDS
        value: "300"
      - key: BACKUP_BATCH_SIZE
        value: "500"
