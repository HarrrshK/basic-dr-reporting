services:
  - type: web
    name: dr-reporting-api
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: alembic -c backend/alembic.ini upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: field-report-staging
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/field_reports.db
      - key: SQLITE_QUEUE_URL
        value: sqlite:////var/data/field_reports.db
      - key: API_ACCESS_TOKEN
        generateValue: true
